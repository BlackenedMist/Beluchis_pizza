<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beluchis — Customer portal preview</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #faf7f0;
    --panel: #fffdf9;
    --ink: #2a2520;
    --muted: #6f675d;
    --line: #e4dccd;
    --accent: #b3351f;
    --accent-dark: #8f2816;
    --good: #2e7d32;
    --radius: 12px;
    --shadow: 0 10px 30px rgba(42,37,32,.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--ink);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font-weight: 800; font-size: 18px;
  }
  .brand h1 { font-size: 19px; margin: 0; letter-spacing: .3px; }
  .brand .sub { font-size: 12px; color: #c9c0b4; }
  nav.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  nav.actions a {
    color: #fff; text-decoration: none; font-size: 14px;
    padding: 9px 14px; border-radius: 8px; background: rgba(255,255,255,.1);
  }
  nav.actions a:hover { background: rgba(255,255,255,.18); }
  .intro {
    max-width: 720px;
    margin: 22px auto 0;
    padding: 0 24px;
    text-align: center;
  }
  .intro p { margin: 6px 0; font-size: 16px; }
  .intro .big { font-size: 19px; font-weight: 700; }
  .intro .muted { color: var(--muted); }
  .toolbar {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    border-top: 1px solid var(--line);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 22px;
    position: sticky; top: 76px; z-index: 19;
  }
  .toolbar .label { font-size: 14px; color: var(--muted); margin-right: 2px; }
  .toolbar button {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  .toolbar button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }
  .stage {
    padding: 30px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .frame-wrap { transition: all .25s ease; }
  .frame {
    background: #151210;
    border-radius: 36px;
    padding: 12px;
    box-shadow: 0 24px 60px rgba(42,37,32,.35), inset 0 0 0 2px #3a342d;
    position: relative;
  }
  .frame .notch {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 22px; background: #151210; border-radius: 0 0 14px 14px;
    z-index: 5;
  }
  .frame iframe {
    display: block;
    width: 100%; height: 760px;
    border: 0;
    border-radius: 26px;
    background: #fff;
  }
  .frame.desktop { border-radius: 14px; padding: 0; box-shadow: var(--shadow); }
  .frame.desktop .notch { display: none; }
  .frame.desktop iframe { border-radius: 12px; height: 860px; }
  .status-note {
    max-width: 620px;
    text-align: center;
    font-size: 15px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 20px;
    box-shadow: var(--shadow);
    color: var(--muted);
  }
  .status-note b { color: var(--good); }
  .status-note.off b { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">B</div>
    <div>
      <h1>Customer portal — preview</h1>
      <div class="sub">The "My Orders" page your customers will use</div>
    </div>
  </div>
  <nav class="actions">
    <a href="/portal" target="_blank" rel="noopener">Open in new tab</a>
  </nav>
</header>

<div class="intro">
  <p class="big">Here they can see their order status, order again, and use their offers.</p>
  <p class="muted">Shown with a sample customer so you can see it exactly as your customers will.</p>
</div>

<div class="toolbar" id="toolbar">
  <span class="label">View on:</span>
  <button class="active" data-w="390" data-h="844">Phone</button>
  <button data-w="768" data-h="1024">Tablet</button>
  <button data-w="0" data-h="0">Computer</button>
</div>

<div class="stage">
  <div class="frame-wrap" id="frameWrap">
    <div class="frame" id="frame">
      <div class="notch"></div>
      <iframe id="liveFrame" src="/portal" title="Live customer portal preview"></iframe>
    </div>
  </div>
  <div class="status-note off" id="statusNote">Preparing your preview…</div>
</div>

<script>
(function () {
  var frame = document.getElementById("frame");
  var live = document.getElementById("liveFrame");
  var wrap = document.getElementById("frameWrap");
  var note = document.getElementById("statusNote");
  var buttons = Array.prototype.slice.call(document.querySelectorAll("#toolbar button"));

  var DEMO_PHONE = "+27 60 555 0000";
  var DEMO_PASSWORD = "beluchis123";

  function apply(b) {
    buttons.forEach(function (x) { x.classList.toggle("active", x === b); });
    if (b.dataset.w === "0") {
      frame.classList.add("desktop");
      wrap.style.width = "";
      live.style.height = "860px";
    } else {
      frame.classList.remove("desktop");
      var width = parseInt(b.dataset.w, 10) + 24;
      wrap.style.width = width + "px";
      live.style.height = parseInt(b.dataset.h, 10) + "px";
    }
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () { apply(b); });
  });

  function updateNote() {
    fetch("/api/customer/auth/me")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (me) {
        if (me && me.cellphone) {
          note.classList.remove("off");
          note.innerHTML = "<b>Signed in.</b> This is a real session for " +
            (firstWord(me.firstName) || "the sample customer") +
            " — what you see is exactly what they would see.";
        } else {
          note.classList.add("off");
          note.textContent = "Not signed in — this is the log-in screen your customers will see.";
        }
      })
      .catch(function () {
        note.classList.add("off");
        note.textContent = "Could not reach the server.";
      });
  }

  function firstWord(s) { return String(s || "").trim().split(/\s+/)[0] || ""; }

  // Sign in as the sample customer (only if nobody is signed in already).
  fetch("/api/customer/auth/me")
    .then(function (r) {
      if (r.ok) return { already: true };
      return fetch("/api/customer/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cellphone: DEMO_PHONE, password: DEMO_PASSWORD })
      }).then(function (r2) {
        if (r2.ok) return { already: false };
        return { failed: true };
      });
    })
    .then(function (res) {
      if (res && res.failed) {
        note.classList.add("off");
        note.textContent = "The sample customer isn't loaded yet (seed overdue re-run). Showing the log-in screen.";
        return;
      }
      // Refresh the live frame so the signed-in portal renders.
      live.src = "/portal";
      updateNote();
    })
    .catch(function () {
      note.classList.add("off");
      note.textContent = "Could not reach the server.";
    });
})();
</script>
</body>
</html>
