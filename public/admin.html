<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beluchis Admin</title>
<link rel="stylesheet" href="theme.css" />
<style>
  header {
    background: var(--ink);
    color: #fff;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  header .stats { font-size: 13px; color: #c9c0b4; }
  header .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  header .header-right a { color: #e8d9c7; font-size: 13px; text-decoration: none; }
  header .header-right a:hover { color: #fff; }
  .role-badge {
    background: var(--accent); color: #fff; border-radius: 20px;
    padding: 4px 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
  }
  .logout {
    background: none; border: 1px solid rgba(255,255,255,.35); color: #fff;
    border-radius: 7px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
  }
  .logout:hover { border-color: #fff; }
  nav {
    display: flex;
    gap: 6px;
    padding: 14px 28px 0;
  }
  nav button {
    border: 1px solid var(--line);
    background: #efe9de;
    color: var(--ink);
    padding: 9px 18px;
    border-radius: 8px 8px 0 0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  nav button.active { background: var(--panel); border-bottom-color: var(--panel); }
  nav button.hidden { display: none; }
  main { padding: 20px 28px 60px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0; font-size: 17px; }
  button.primary {
    background: var(--accent);
    color: #fff;
    border: 0;
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.ghost {
    background: #efe9de; border: 1px solid var(--line); color: var(--ink);
    padding: 8px 14px; border-radius: 7px; font-size: 13px; cursor: pointer;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  tr:hover td { background: #fbf7ef; }
  a { color: var(--accent); }
  .tag {
    display: inline-block;
    background: #f0e8dc;
    border-radius: 6px;
    padding: 2px 7px;
    margin: 1px 3px 1px 0;
    font-size: 12px;
  }
  .tag.off { background: #e8e2d8; color: var(--muted); }
  .tag.ok { background: #e6f4ea; color: #2e7d32; }
  .tag.warn { background: #fff3e0; color: #b26a00; }
  .muted { color: var(--muted); }
  .row-actions button {
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 9px;
    margin-right: 5px;
    font-size: 12px;
    cursor: pointer;
  }
  .row-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .row-actions button.danger:hover { border-color: var(--bad); color: var(--bad); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .card-list { display: grid; gap: 12px; }
  .msg-card { border-left: 4px solid var(--accent); }
  .msg-card.unread { background: #fff8ec; border-left-color: #e0a500; }
  .msg-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .msg-body { white-space: pre-wrap; margin: 8px 0 12px; font-size: 14px; }

  /* modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(42,37,32,.5);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow: auto; z-index: 10;
  }
  .modal {
    background: var(--panel);
    border-radius: 12px;
    width: 100%;
    max-width: 720px;
    padding: 22px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.2);
  }
  .modal h3 { margin: 0 0 16px; font-size: 16px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 13.5px;
    background: #fff;
    color: var(--ink);
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .price-row { display: grid; grid-template-columns: 90px 90px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
  .price-row .size { font-weight: 600; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .link-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .link-grid label { font-size: 12.5px; display: flex; gap: 6px; align-items: center; }

  /* search & filters */
  .search {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 13.5px;
    width: 230px;
  }
  .filterbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filterbar select {
    padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; font-size: 13px; background: #fff; color: var(--ink);
  }
  .result-count { font-size: 12px; color: var(--muted); margin-left: auto; }
  .parts-tag { display: inline-block; background: #f0e8dc; border-radius: 6px; padding: 2px 7px; margin: 1px 3px 1px 0; font-size: 12px; }
  .num {
    width: 56px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; background: #fff; color: var(--ink);
  }
  .specials-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 12px; max-height: 260px; overflow: auto;
    border: 1px solid var(--line); border-radius: 8px; padding: 10px;
  }
  .specials-grid label { font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .specials-grid .num { margin-left: auto; }

  /* orders board */
  .order-list { display: flex; flex-direction: column; gap: 14px; }
  .order-card {
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    padding: 14px 16px;
  }
  .order-card.is-new { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .order-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .order-id { font-weight: 700; font-size: 15px; }
  .order-time { font-size: 12px; color: var(--muted); }
  .order-total { font-weight: 700; font-size: 16px; }
  .pay-chip {
    display: inline-block; border-radius: 20px; padding: 3px 10px;
    font-size: 11px; font-weight: 600; letter-spacing: .2px;
    background: var(--line); color: #333; white-space: nowrap;
  }
  .pay-chip.plaid { background: #e5f6ea; color: #1c7c3e; }
  .pay-chip.pfailed { background: #fdeaea; color: var(--bad); }
  .pay-chip.ppending { background: #fff6e0; color: #9a6700; }
  .status-badge {
    display: inline-block; border-radius: 20px; padding: 3px 10px;
    font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; color: #fff;
  }
  .s-placed          { background: #ef6c00; }
  .s-preparing       { background: #1976d2; }
  .s-out_for_delivery{ background: #6a1b9a; }
  .s-delivered       { background: #2e7d32; }
  .s-cancelled       { background: #616161; }
  .order-cust { margin-top: 10px; font-size: 13.5px; }
  .order-dest { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .order-notes {
    margin-top: 8px; font-size: 12.5px; color: var(--accent-dark);
    background: #fbf3ec; border: 1px dashed var(--line); border-radius: 7px; padding: 6px 9px;
  }
  .order-items { margin-top: 10px; font-size: 12.5px; }
  .order-items th, .order-items td { padding: 5px 8px; }
  .order-items .extras { font-size: 11.5px; color: var(--muted); }
  .order-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .order-actions button {
    border: 1px solid var(--line); border-radius: 7px; background: #f5f0e6;
    padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink);
  }
  .order-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .order-actions button.ok { background: var(--good); border-color: var(--good); color: #fff; }
  .order-actions button.ok:hover { opacity: .9; color: #fff; }
  .order-actions button.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
  .order-actions button.bad:hover { opacity: .9; color: #fff; }
  .order-actions button:disabled { opacity: .45; cursor: not-allowed; }
  .status-tally { display: flex; gap: 8px; flex-wrap: wrap; }
  .status-tally button {
    border: 1px solid var(--line); background: #fff; border-radius: 20px;
    padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  .status-tally button.active { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .dot.placed           { background: #ef6c00; }
  .dot.preparing        { background: #1976d2; }
  .dot.out_for_delivery { background: #6a1b9a; }
  .dot.delivered        { background: #2e7d32; }
  .dot.cancelled        { background: #616161; }

  #toast {
    position: fixed; bottom: 22px; right: 22px; background: var(--ink); color: #fff;
    padding: 11px 18px; border-radius: 9px; font-size: 13.5px; opacity: 0;
    transition: opacity .25s; z-index: 20; max-width: 360px;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Beluchis Admin</h1>
  <input id="global-search" class="search" placeholder="Search menu…" />
  <div class="stats" id="stats"></div>
  <div class="header-right">
    <span id="me-name" class="muted" style="color:#c9c0b4;font-size:13px"></span>
    <span id="me-role" class="role-badge"></span>
    <a href="/order" target="_blank" rel="noopener">View menu</a>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</header>
<nav>
  <button data-tab="orders" class="active">Orders</button>
  <button data-tab="contact" data-roles="admin,orders">Inbox</button>
  <button data-tab="items" data-roles="admin">Items</button>
  <button data-tab="specials" data-roles="admin">Specials</button>
  <button data-tab="toppings" data-roles="admin">Toppings</button>
  <button data-tab="bases" data-roles="admin">Bases</button>
  <button data-tab="categories" data-roles="admin">Categories</button>
  <button data-tab="users" data-roles="admin">Users</button>
  <button data-tab="loyalty" data-roles="admin">Loyalty</button>
  <button data-tab="delivery" data-roles="admin">Delivery</button>
</nav>
<main>
  <section id="tab-orders" class="panel"></section>
  <section id="tab-contact" class="panel" hidden></section>
  <section id="tab-items" class="panel" hidden></section>
  <section id="tab-specials" class="panel" hidden></section>
  <section id="tab-toppings" class="panel" hidden></section>
  <section id="tab-bases" class="panel" hidden></section>
  <section id="tab-categories" class="panel" hidden></section>
  <section id="tab-users" class="panel" hidden></section>
  <section id="tab-loyalty" class="panel" hidden></section>
  <section id="tab-delivery" class="panel" hidden></section>
</main>
<div id="toast"></div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const state = {
  items: [], toppings: [], bases: [], categories: [], specials: [],
  orders: [], users: [], contact: [], me: null,
  tab: "orders", search: "",
  fItems: { category: "", type: "", active: "" },
  fStatus: "", orderSearch: "",
  loyalty: null, coupons: [],
  fLoyalty: { q: "", tier: "", window: "365", minSpend: "", minOrders: "" },
  fCoupons: "active",
  known: new Set(),
  settings: {},
  delivery: null,
};

const ROLES = {
  admin: "Admin",
  orders: "Orders",
  kitchen: "Main Kitchen",
};
const STATUSES = ["placed", "preparing", "out_for_delivery", "delivered", "cancelled"];
const STATUS_NAMES = {
  placed: "Placed",
  preparing: "Preparing",
  out_for_delivery: "Out for delivery",
  delivered: "Delivered",
  cancelled: "Cancelled",
};
const STATUS_FLOW = {
  placed: ["preparing"],
  preparing: ["out_for_delivery"],
  out_for_delivery: ["delivered"],
  delivered: [],
  cancelled: [],
};

async function api(url, opts={}) {
  const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

function toast(msg, isErr=false) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = isErr ? "show err" : "show";
  setTimeout(() => (t.className = ""), 2600);
}

function roleLabel(r) { return ROLES[r] || r; }

async function loadAll() {
  const [items, toppings, bases, categories, specials, stats] = await Promise.all([
    api("/api/items"), api("/api/toppings"), api("/api/bases"), api("/api/categories"), api("/api/specials"), api("/api/stats"),
  ]);
  state.items = items; state.toppings = toppings; state.bases = bases; state.categories = categories; state.specials = specials;
  $("#stats").textContent = `${stats.items} items · ${stats.specials} specials · ${stats.toppings} toppings · ${stats.bases} bases · ${stats.categories} categories · ${stats.orders} orders`;
  if (state.me?.role === "admin") {
    try { state.settings = (await api("/api/settings")).settings; state.delivery = (await api("/api/delivery/config")); }
    catch { state.settings = {}; state.delivery = null; }
  }
  render();
}

function roleGating() {
  const role = state.me?.role;
  $$("nav button[data-roles]").forEach((b) => {
    const allowed = String(b.dataset.roles || "").split(",").includes(role);
    b.classList.toggle("hidden", !allowed);
    b.disabled = !allowed; // don't let hidden-but-focusable buttons open restricted tabs
  });
}

// ------------------------------------------------------------------ Orders
window.setOrderStatus = async (id, status) => {
  try {
    const updated = await api(`/api/orders/${id}`, { method: "PUT", body: JSON.stringify({ status }) });
    toast(`#${updated.id} → ${STATUS_NAMES[updated.status]}`);
    await loadOrders();
  } catch (e) { toast(e.message, true); }
};

function orderTime(iso) {
  const d = new Date(iso);
  const today = new Date().toDateString() === d.toDateString();
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return today ? time : `${d.toLocaleDateString([], { month: "short", day: "numeric" })} ${time}`;
}

function orderLine(line) {
  let extras = "";
  if (line.extras) {
    try {
      const list = JSON.parse(line.extras);
      if (list.length) extras = `<div class="extras">+ ${list.map((x) => esc(x.name)).join(", ")}</div>`;
    } catch {}
  }
  const size = line.sizeLabel ? `<td>${esc(line.sizeLabel)}</td>` : "<td></td>";
  return `<tr>
    <td><b>${esc(line.itemName)}</b>${extras}</td>
    ${size}
    <td>${line.quantity}</td>
    <td>R${line.unitPrice}</td>
    <td><b>R${line.total}</b></td>
  </tr>`;
}

function orderActions(order) {
  const role = state.me?.role;
  const next = STATUS_FLOW[order.status] || [];
  const canCancel = role === "admin" || role === "orders";
  const btn = (status) =>
    `<button class="${status === "cancelled" ? "bad" : "ok"}" onclick="setOrderStatus(${order.id}, '${status}')">${
      status === "cancelled" ? "Cancel order" : `Mark ${STATUS_NAMES[status]}`
    }</button>`;
  const out = next.map(btn);
  if (canCancel && order.status !== "cancelled" && order.status !== "delivered") out.push(btn("cancelled"));
  return out.join("");
}

async function loadOrders() {
  try {
    const orders = await api("/api/orders");
    state.orders = orders;
    renderOrders();
  } catch (e) {
    if (state.tab === "orders") toast(e.message, true);
  }
}

function renderOrders() {
  const el = $("#tab-orders");
  const q = state.orderSearch.trim().toLowerCase();
  const filtered = state.orders.filter((o) => {
    const statusOk = !state.fStatus || o.status === state.fStatus;
    const name = `${o.customer?.firstName || ""} ${o.customer?.lastName || ""}`;
    const matchQ = !q || String(o.id).includes(q) || name.toLowerCase().includes(q) ||
      (o.customer?.cellphone || "").toLowerCase().includes(q) || (o.deliveryAddress || "").toLowerCase().includes(q);
    return statusOk && matchQ;
  });
  const tally = (s) => state.orders.filter((o) => o.status === s).length;

  const head = (o) => {
    const payLabels = { cod_cash: "Cash on delivery", cod_card: "Card on delivery", paygate: "Online (PayGate)" };
    const payChip = o.paymentMethod === "paygate"
      ? `<span class="pay-chip p${o.paymentStatus}">${payLabels[o.paymentMethod] || o.paymentMethod} · ${o.paymentStatus}</span>`
      : `<span class="pay-chip">${payLabels[o.paymentMethod] || o.paymentMethod}</span>`;
    return `
    <div class="order-head">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="order-id">#${o.id}</span>
        <span class="status-badge s-${o.status}">${STATUS_NAMES[o.status]}</span>
        <span class="order-time">${orderTime(o.createdAt)}</span>
        ${payChip}
      </div>
      <div class="order-total">R${o.discountAmount ? (o.grandTotal ?? o.total) : o.total}</div>
    </div>`;
  };

  const contact = (o) => {
    const c = o.customer || {};
    const bits = [`${esc(c.firstName || "?")} ${esc(c.lastName || "")}`.trim()];
    if (c.cellphone) bits.push(`<a href="tel:${esc(c.cellphone)}">${esc(c.cellphone)}</a>`);
    if (c.email) bits.push(`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`);
    return bits.join(" · ");
  };

  const dest = (o) => {
    let chip = "";
    if (o.deliveryStatus === "free")
      chip = `<span class="tag ok">Free delivery${o.deliveryDistance != null ? " \u00b7 " + o.deliveryDistance.toFixed(1) + "km" : ""}</span>`;
    else if (o.deliveryStatus === "fee")
      chip = `<span class="tag warn">R${o.deliveryFee} delivery${o.deliveryDistance != null ? " \u00b7 " + o.deliveryDistance.toFixed(1) + "km" : ""}</span>`;
    else if (o.deliveryStatus === "unverified")
      chip = `<span class="tag off">Delivery unverified \u2014 confirm range</span>`;
    if (!o.deliveryAddress) return `<span class="dot placed" style="background:#616161"></span>Collection <span class='muted'>(call to collect)</span> ${chip}`;
    return `<span class="dot placed" style="background:#ef6c00"></span>Delivery: ${esc(o.deliveryAddress)} ${chip}`;
  };

  el.innerHTML = `
    <div class="toolbar">
      <h2>Orders <span class="muted" style="font-size:12px;font-weight:400">${state.orders.length} total</span></h2>
      <div style="display:flex;gap:8px">
        <input class="search" id="order-search" placeholder="Search order, name, phone…" value="${esc(state.orderSearch)}" oninput="state.orderSearch=this.value;renderOrders()" />
        <button class="primary" onclick="loadOrders()">Refresh</button>
      </div>
    </div>
    <div class="filterbar">
      <div class="status-tally">
        <button class="${state.fStatus === "" ? "active" : ""}" onclick="state.fStatus='';renderOrders()">All (${state.orders.length})</button>
        ${STATUSES.map((s) => `<button class="${state.fStatus === s ? "active" : ""}" onclick="state.fStatus='${s}';renderOrders()">
          <span class="dot ${s}"></span>${STATUS_NAMES[s]} (${tally(s)})</button>`).join("")}
      </div>
    </div>
    ${filtered.length ? `
      <div class="order-list">
        ${filtered.map((o) => `
          <div class="order-card ${!state.known.has(o.id) ? "is-new" : ""}">
            ${head(o)}
            <div class="order-cust">${contact(o)}</div>
            <div class="order-dest">${dest(o)}</div>
            ${o.notes ? `<div class="order-notes">Notes: ${esc(o.notes)}</div>` : ""}
            <table class="order-items">
              <thead><tr><th>Item</th><th>Size</th><th>Qty</th><th>Unit</th><th>Total</th></tr></thead>
              <tbody>${o.items.map(orderLine).join("")}</tbody>
            </table>
            <div class="order-actions">${orderActions(o)}</div>
          </div>`).join("")}
      </div>` : `<div class="empty">${state.orders.length ? "No orders match" : "No orders yet"}</div>`}`;

  state.known = new Set(state.orders.map((o) => o.id));
  $$("#tab-orders").forEach((s) => (s.hidden = s.id !== `tab-${state.tab}`));
  $("#tab-orders").hidden = state.tab !== "orders";
}

// ---------------------------------------------------------------- Contact
async function loadContact() {
  try {
    state.contact = await api("/api/contact");
    renderContact();
  } catch (e) { toast(e.message, true); }
}

function renderContact() {
  const el = $("#tab-contact");
  const msgs = state.contact;
  const unread = msgs.filter((m) => !m.isRead).length;
  el.innerHTML = `

        ${unread ? `<button class="ghost" onclick="markAllContactRead()">Mark all read</button>` : ""}
        <button class="primary" onclick="loadContact()">Refresh</button>
      </div>
    </div>
    ${msgs.length ? `<div class="card-list">
      ${msgs.map((m) => `
        <div class="card msg-card${m.isRead ? "" : " unread"}" data-id="${m.id}">
          <div class="msg-top">
            <b>${esc(m.name)}</b>
            ${m.email ? `<a class="muted" href="mailto:${esc(m.email)}" style="font-size:12.5px">${esc(m.email)}</a>` : ""}

}

window.saveUser = async (id) => {
  const name = $("#u-name").value.trim();
  const role = $("#u-role").value;
  const isActive = $("#u-active").value === "true";
  if (!name) return toast("Name is required", true);
  try {
    if (id) {
      await api(`/api/users/${id}`, { method: "PUT", body: JSON.stringify({ name, role, isActive }) });
      toast("User saved");
    } else {
      const username = $("#u-user").value.trim();
      const pin = $("#u-pin").value;
      if (!username) return toast("Username is required", true);
      if (!pin || pin.length < 4) return toast("PIN must be at least 4 characters", true);
      await api("/api/users", { method: "POST", body: JSON.stringify({ name, username, pin, role, isActive }) });
      toast("User added");
    }
    $(".overlay")?.remove();
    await loadUsers();
  } catch (e) { toast(e.message, true); }
};

window.openResetPin = (id) => {
  const u = state.users.find((x) => x.id === id);
  if (!u) return;
  const wrap = document.createElement("div");
  wrap.className = "overlay";
  wrap.innerHTML = `<div class="modal">
    <h3>Reset PIN — ${esc(u.name)}</h3>
    <div class="field"><label>New PIN (4+ characters) *</label><input id="r-pin" type="password" /></div>
    <div class="modal-actions">
      <button class="ghost" onclick="this.closest('.overlay').remove()">Cancel</button>
      <button class="primary" onclick="saveResetPin(${id})">Save PIN</button>
    </div>
  </div>`;
  wrap.addEventListener("click", (e) => { if (e.target === wrap) wrap.remove(); });
  document.body.appendChild(wrap);
};

window.saveResetPin = async (id) => {
  const pin = $("#r-pin").value;
  if (!pin || pin.length < 4) return toast("PIN must be at least 4 characters", true);
  try {
    await api(`/api/users/${id}/pin`, { method: "POST", body: JSON.stringify({ pin }) });
    toast("PIN updated"); $(".overlay")?.remove();
  } catch (e) { toast(e.message, true); }
};

window.delUser = async (id) => {
  const u = state.users.find((x) => x.id === id);
  if (state.me?.principal === `staff:${id}`) return toast("You can't delete your own account", true);
  if (!confirm(`Delete user "${u?.name}"?`)) return;
  try { await api(`/api/users/${id}`, { method: "DELETE" }); toast("User deleted"); await loadUsers(); }
  catch (e) { toast(e.message, true); }
};

// ------------------------------------------------------------------ Items
function itemMatches(i) {
  const q = state.search.trim().toLowerCase();
  const matchQ = !q || i.name.toLowerCase().includes(q) || (i.description || "").toLowerCase().includes(q) || (i.category?.name || "").toLowerCase().includes(q);
  const catOk = state.fItems.category === "" ? true : state.fItems.category === "none" ? !i.categoryId : i.categoryId === Number(state.fItems.category);
  const typeOk = state.fItems.type === "" ? true : i.itemType === state.fItems.type;
  const actOk = state.fItems.active === "" ? true : state.fItems.active === "active" ? i.isActive : !i.isActive;
  return matchQ && catOk && typeOk && actOk;
}

function renderItems() {
  const el = $("#tab-items");
  const items = state.items.filter(itemMatches);
  const filtering = state.search.trim() !== "" || state.fItems.category !== "" || state.fItems.type !== "" || state.fItems.active !== "";

  el.innerHTML = `

      </select>

    </div>

      return byCategory.map((c) => `

        </div>

        <table>
          <thead><tr><th>Name</th><th>Type</th><th>Sizes</th><th>Toppings</th><th>Bases</th><th></th></tr></thead>
          <tbody>
            ${c.items.map((i) => `
              <tr>
                <td><b>${esc(i.name)}</b>${i.description ? `<br><span class="muted">${esc(i.description)}</span>` : ""}</td>
                <td>${esc(i.itemType)}</td>

                <td>${i.toppings.length ? i.toppings.slice(0,4).map((t) => `<span class="tag">${esc(t.topping.name)}</span>`).join("") + (i.toppings.length>4?`<span class="tag off">+${i.toppings.length-4}</span>`:"") : '<span class="muted">—</span>'}</td>

                </td>
              </tr>`).join("")}

        </table>
      </div>`).join("");
    })() : `<div class="empty">${filtering ? "No items match your search or filters" : "No items"}</div>`}`;

// ---------------------------------------------------------------- Modals
function openModal(html) {
  const wrap = document.createElement("div");
  wrap.className = "overlay";
  wrap.innerHTML = `<div class="modal">${html}</div>`;
  wrap.addEventListener("click", (e) => { if (e.target === wrap) wrap.remove(); });
  document.body.appendChild(wrap);
  return wrap;
}

const popup = (html) => openModal(html);

const field = (label, inner) => `<div class="field"><label>${label}</label>${inner}</div>`;

// Item

  const item = id ? state.items.find((i) => i.id === id) : null;
  const wrap = openModal(`
    <h3>${item ? "Edit" : "Add"} Item</h3>
    <div class="row">
      ${field("Name *", `<input id="f-name" value="${item?.name || ""}" />`)}
      ${field("Type", `<select id="f-type">

        <option value="special"${item?.itemType==="special"?" selected":""}>special</option>
      </select>`)}
    </div>
    ${field("Description", `<textarea id="f-desc" rows="2">${item?.description || ""}</textarea>`)}
    <div class="row">
      ${field("Category", `<select id="f-cat">
        <option value="">— none —</option>
        ${state.categories.map((c) => `<option value="${c.id}"${item?.categoryId===c.id?" selected":""}>${c.name}</option>`).join("")}
      </select>`)}
      ${field("Sort order", `<input id="f-sort" type="number" value="${item?.sortOrder ?? 0}" />`)}
    </div>
    ${field("Sizes", `
      <div id="f-sizes"></div>
      <button class="ghost" onclick="addSizeRow()" style="margin-top:6px">+ Add size</button>`)}
    <div class="row">
      ${field("Toppings", `<div id="f-toppings" class="link-grid"></div>`)}
      ${field("Bases", `<div id="f-bases" class="link-grid"></div>`)}
    </div>
    <div class="modal-actions">
      <button class="ghost" onclick="this.closest('.overlay').remove()">Cancel</button>
      <button class="primary" onclick="saveItem(${id ?? ""})">Save</button>
    </div>`);

  let sizes;
  if (item) {
    sizes = item.sizes.map((s) => ({ sizeLabel: s.sizeLabel, price: s.price }));
  } else {
    sizes = [["S",""],["M",""],["L",""]].map(([s, p]) => ({ sizeLabel: s, price: p }));
  }
  window.currentSizes = sizes;
  window.renderSizeRows = () => {
    $("#f-sizes").innerHTML = currentSizes.map((s, idx) => `
      <div class="price-row">
        <span class="size">${s.sizeLabel}</span>
        <span class="muted">R</span><input placeholder="price" value="${s.price}" oninput="currentSizes[${idx}].price=this.value" />
        <button class="ghost" onclick="currentSizes.splice(${idx},1);renderSizeRows()">✕</button>
      </div>`).join("");
  };
  window.addSizeRow = () => { currentSizes.push({ sizeLabel: "M", price: "" }); renderSizeRows(); };
  renderSizeRows();

  $("#f-toppings").innerHTML = state.toppings.map((t) => `
    <label><input type="checkbox" value="${t.id}" ${item?.toppings.some((x) => x.toppingId===t.id) ? "checked" : ""}> ${t.name}</label>`).join("");
  $("#f-bases").innerHTML = state.bases.map((b) => `
    <label><input type="checkbox" value="${b.id}" ${item?.bases.some((x) => x.baseId===b.id) ? "checked" : ""}> ${b.name}</label>`).join("");
};

window.saveItem = async (id) => {
  const payload = {
    name: $("#f-name").value.trim(),
    itemType: $("#f-type").value,
    description: $("#f-desc").value.trim() || null,
    categoryId: $("#f-cat").value ? Number($("#f-cat").value) : null,
    sortOrder: Number($("#f-sort").value) || 0,
    sizes: currentSizes.map((s) => ({ sizeLabel: s.sizeLabel, price: Number(s.price) || 0 })),
    toppingIds: $$("#f-toppings input:checked").map((c) => Number(c.value)),
    baseIds: $$("#f-bases input:checked").map((c) => Number(c.value)),
  };
  if (!payload.name) return toast("Name is required", true);
  try {
    if (id) await api(`/api/items/${id}`, { method: "PUT", body: JSON.stringify(payload) });
    else await api("/api/items", { method: "POST", body: JSON.stringify(payload) });
    toast("Item saved");
    $(".overlay")?.remove();
    await loadAll();
  } catch (e) { toast(e.message, true); }
};

window.delItem = async (id) => {
  if (!confirm("Delete this item?")) return;
  try { await api(`/api/items/${id}`, { method: "DELETE" }); toast("Item deleted"); await loadAll(); }
  catch (e) { toast(e.message, true); }
};

// ---------------------------------------------------------------- Specials
function renderSpecials() {
  const el = $("#tab-specials");
  const q = state.search.trim().toLowerCase();
  const list = state.specials.filter((s) => {
    if (!q) return true;
    const parts = s.items.map((x) => x.item.name).join(" ");
    return s.name.toLowerCase().includes(q) || (s.description || "").toLowerCase().includes(q) || parts.toLowerCase().includes(q);
  });
  const partsSum = (s) =>
    s.items.reduce((sum, x) => {
      const sizes = x.item.sizes || [];
      if (!sizes.length) return sum;
      return sum + Math.min(...sizes.map((sz) => sz.price)) * x.quantity;
    }, 0);

  el.innerHTML = `
    <div class="toolbar">
      <h2>Specials</h2>
      <div style="display:flex;gap:8px">
        <input class="search" placeholder="Search specials…" value="${esc(state.search)}" oninput="state.search=this.value;$('#global-search').value=this.value;render()" />
        <button class="primary" onclick="openSpecial()">+ Add special</button>
      </div>
    </div>
    ${list.length ? `
    <table>
      <thead><tr><th>Name</th><th>Price</th><th>Parts</th><th>Active</th><th></th></tr></thead>
      <tbody>
        ${list.map((s) => {
          const sum = partsSum(s);
          const deal = sum > 0 && s.price < sum ? Math.round((1 - s.price / sum) * 100) : null;
          return `
          <tr>
            <td><b>${esc(s.name)}</b>${s.description ? `<br><span class="muted">${esc(s.description)}</span>` : ""}</td>
            <td>R${s.price}${sum > 0 ? `<br><span class="muted">parts R${sum}</span>` : ""}${deal ? `<br><span class="parts-tag" style="background:#e8f5e9;color:#2e7d32">${deal}% off</span>` : ""}</td>
            <td>${s.items.map((x) => `<span class="parts-tag">${esc(x.item.name)}${x.quantity > 1 ? ` ×${x.quantity}` : ""}</span>`).join("")}</td>
            <td>${s.isActive ? "Active" : '<span class="muted">Inactive</span>'}</td>
            <td class="row-actions">
              <button onclick="openSpecial(${s.id})">Edit</button>
              <button class="danger" onclick="delSpecial(${s.id})">Delete</button>
            </td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>` : `<div class="empty">${state.specials.length ? "No specials match your search" : "No specials yet"}</div>`}`;
}

window.openSpecial = (id) => {
  const s = id ? state.specials.find((x) => x.id === id) : null;
  openModal(`
    <h3>${s ? "Edit" : "Add"} Special</h3>
    <div class="row">
      ${field("Name *", `<input id="sp-name" value="${esc(s?.name || "")}" />`)}
      ${field("Price (R)", `<input id="sp-price" type="number" value="${s?.price ?? ""}" oninput="renderSpecialSum()" />`)}
    </div>
    ${field("Description", `<textarea id="sp-desc" rows="2">${esc(s?.description || "")}</textarea>`)}
    <div class="row">
      ${field("Sort order", `<input id="sp-sort" type="number" value="${s?.sortOrder ?? 0}" />`)}
      ${field("Active", `<select id="sp-active">
        <option value="true"${s?.isActive !== false ? " selected" : ""}>Active</option>
        <option value="false"${s?.isActive === false ? " selected" : ""}>Inactive</option>
      </select>`)}
    </div>
    ${field("Items", `<div id="sp-items" class="specials-grid"></div>`)}
    <div id="sp-sum" class="muted" style="font-size:12.5px;margin-top:4px"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="this.closest('.overlay').remove()">Cancel</button>
      <button class="primary" onclick="saveSpecial(${id ?? ""})">Save</button>
    </div>`);

  window.specialPicks = s ? s.items.map((x) => ({ itemId: x.itemId, quantity: x.quantity })) : [];
  window.renderSpecialPicks = () => {
    $("#sp-items").innerHTML = state.items.map((i) => {
      const pick = specialPicks.find((p) => p.itemId === i.id);
      const checked = pick ? "checked" : "";
      const qty = pick ? pick.quantity : 1;
      return `<label>
        <input type="checkbox" value="${i.id}" ${checked} onchange="toggleSpecialPick(${i.id}, this.checked)" />
        <span>${esc(i.name)}</span>
        <input class="num" type="number" min="1" value="${qty}" ${checked ? "" : "disabled"} oninput="setSpecialQty(${i.id}, this.value)" />
      </label>`;
    }).join("");
  };
  window.toggleSpecialPick = (itemId, on) => {
    specialPicks = on ? [...specialPicks, { itemId, quantity: 1 }] : specialPicks.filter((p) => p.itemId !== itemId);
    renderSpecialPicks();
    renderSpecialSum();
  };
  window.setSpecialQty = (itemId, v) => {
    const p = specialPicks.find((x) => x.itemId === itemId);
    if (p) p.quantity = Math.max(1, Number(v) || 1);
    renderSpecialSum();
  };
  window.renderSpecialSum = () => {
    const el = $("#sp-sum");
    const priceEl = $("#sp-price");
    if (!el) return;
    const price = Number(priceEl?.value);
    const itemsById = new Map(state.items.map((i) => [i.id, i]));
    const sum = specialPicks.reduce((acc, p) => {
      const item = itemsById.get(p.itemId);
      if (!item || !item.sizes.length) return acc;
      return acc + Math.min(...item.sizes.map((sz) => sz.price)) * (p.quantity || 1);
    }, 0);
    if (sum <= 0) { el.textContent = ""; return; }
    const priceTxt = price >= 0 ? `  ·  Your price R${price}` : "";
    const save = price > 0 ? (price < sum ? `  ·  ~${Math.round((1 - price / sum) * 100)}% off` : "  ·  above parts total") : "";
    el.textContent = `Parts total (cheapest sizes): R${sum}${priceTxt}${save}`;
  };
  renderSpecialPicks();
  renderSpecialSum();
};

// ------------------------------------------------------------- Loyalty
const TIER_STYLE = {
  platinum: ["#e8e3f7", "#5b3fa8"],
  gold: ["#fbf0d9", "#93621a"],
  silver: ["#e9edf2", "#4a6072"],
  bronze: ["#f1e4dc", "#8a4b22"],
  none: ["#ece7dd", "#6f675d"],
};
const tierBadge = (t) => {
  const [bg, fg] = TIER_STYLE[t] || TIER_STYLE.none;
  return `<span style="display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;background:${bg};color:${fg}">${esc(t)}</span>`;
};
const loyMoney = (n) => "R" + Number(n || 0).toLocaleString("en-ZA");
const loyDate = (iso) =>
  iso ? new Date(iso).toLocaleDateString([], { day: "numeric", month: "short" }) : "—";

async function loadLoyalty() {
  try {
    const f = state.fLoyalty;
    const qs = new URLSearchParams();
    if (f.q) qs.set("q", f.q);
    if (f.tier) qs.set("tier", f.tier);
    qs.set("window", f.window || "365");
    if (f.minSpend !== "") qs.set("minSpend", f.minSpend);
    if (f.minOrders !== "") qs.set("minOrders", f.minOrders);
    const [loyalty, coupons] = await Promise.all([
      api(`/api/loyalty/customers?${qs}`),
      api(`/api/loyalty/coupons?status=${encodeURIComponent(state.fCoupons)}`),
    ]);
    state.loyalty = loyalty;
    state.coupons = coupons;
    render();
  } catch (e) {
    toast(e.message, true);
  }
}

window.applyLoyaltyFilters = () => {
  state.fLoyalty.q = $("#loy-q").value.trim();
  state.fLoyalty.tier = $("#loy-tier").value;
  state.fLoyalty.window = $("#loy-window").value || "365";
  state.fLoyalty.minSpend = $("#loy-minspend").value.trim();
  state.fLoyalty.minOrders = $("#loy-minorders").value.trim();
  loadLoyalty();
};

window.resetLoyaltyFilters = () => {
  state.fLoyalty = { q: "", tier: "", window: "365", minSpend: "", minOrders: "" };
  loadLoyalty();
};

window.setCouponStatus = (status) => {
  state.fCoupons = status;
  loadLoyalty();
};

const WIN_LABEL = { 30: "30d", 90: "90d", 365: "1yr", lifetime: "Total" };

function loyaltyTable(data) {
  const f = state.fLoyalty;
  const rowKey = ({ 30: "spend30", 90: "spend90", 365: "spend365", lifetime: "spendLifetime" })[f.window] || "spend365";
  const sortTxt =
    data.total > 0
      ? `${data.total} customer${data.total === 1 ? "" : "s"} · sorted by ${WIN_LABEL[f.window]} spend`
      : "No customers match the filters";
  if (!data.rows.length)
    return `<div class="muted" style="margin-top:14px">${sortTxt}.</div>`;
  const head = `
    <tr>
      <th>Customer</th>
      <th>Contact</th>
      <th>Tier</th>
      <th style="text-align:center">Orders</th>
      <th style="text-align:right">Last 30d</th>
      <th style="text-align:right">90d</th>
      <th style="text-align:right">1yr</th>
      <th style="text-align:right">Total</th>
      <th style="text-align:center">Last order</th>
      <th></th>
    </tr>`;
  const body = data.rows
    .map(
      (c) => `
    <tr data-tier="${esc(c.tier)}" data-customer="${c.id}">
      <td><b>${esc(c.name)}</b><br><span class="muted">loyalty ${(c.score365 || 0).toFixed(1)}% of ${WIN_LABEL[365]} sales</span></td>
      <td class="muted">${c.cellphone ? esc(c.cellphone) + "<br>" : ""}${esc(c.email || "")}</td>
      <td>${tierBadge(c.tier)}</td>
      <td style="text-align:center">${c.orders}</td>
      <td style="text-align:right">${loyMoney(c.spend30)}${f.window === "30" ? " <b>←</b>" : ""}</td>
      <td style="text-align:right">${loyMoney(c.spend90)}${f.window === "90" ? " <b>←</b>" : ""}</td>
      <td style="text-align:right">${loyMoney(c.spend365)}${f.window === "365" ? " <b>←</b>" : ""}</td>
      <td style="text-align:right">${loyMoney(c.spendLifetime)}${f.window === "lifetime" ? " <b>←</b>" : ""}</td>
      <td style="text-align:center">${loyDate(c.lastOrderAt)}</td>
      <td style="text-align:right"><button class="ghost" onclick="openIssueCoupon(${c.id})">Issue</button></td>
    </tr>`
    )
    .join("");

  const windowRadio = (v, lbl) =>
    `<label style="margin-right:12px;cursor:pointer"><input type="radio" name="rowwindow" value="${v}" ${f.window === v ? "checked" : ""} onchange="switchRowWindow('${v}')"> ${lbl}</label>`;

  return `
    <table class="grid">
      <thead>${head}</thead>
      <tbody>${body}</tbody>
    </table>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px">
      <span class="muted">${sortTxt}</span>
      <span class="muted">Tips: ${tierBadge("platinum")} ≥30% ${tierBadge("gold")} ≥20% ${tierBadge("silver")} ≥10% ${tierBadge("bronze")} ≥5% of 12-month sales.</span>
    </div>`;
}

window.switchRowWindow = (v) => {
  state.fLoyalty.window = v;
  loadLoyalty();
};

function couponStatusMeta(c) {
  if (c.usedAt) return { label: "Used", style: "background:#ece7dd;color:#6f675d" };
  if (c.isActive && (c.expiresAt && new Date(c.expiresAt) < new Date())) return { label: "Expired", style: "background:#fdecea;color:#c62828" };
  if (c.isActive) return { label: "Active", style: "background:#e9f6ec;color:#2e7d32" };
  return { label: "Off", style: "background:#ece7dd;color:#6f675d" };
}

function couponsTable(rows) {
  if (!rows) return `<div class="muted" style="margin-top:8px">Loading coupons…</div>`;
  if (!rows.length) return `<div class="muted" style="margin-top:8px">No coupons in this view.</div>`;
  return `
    <table class="grid">
      <thead><tr>
        <th>Code</th><th>Value</th><th>For</th><th>Status</th><th style="text-align:right">Uses</th><th style="text-align:right">Issued</th><th></th>
      </tr></thead>
      <tbody>
        ${rows
          .map((c) => {
            const st = couponStatusMeta(c);
            const who = c.customer
              ? `${esc(c.customer.firstName + " " + (c.customer.lastName || ""))} <span class="muted">${esc(c.customer.cellphone || "")}</span>`
              : '<span class="muted">Public code</span>';
            const extra = [c.minSpend ? `min ${loyMoney(c.minSpend)}` : "", c.expiresAt ? `until ${new Date(c.expiresAt).toLocaleDateString([], { day: "numeric", month: "short" })}` : ""]
              .filter(Boolean)
              .join(" · ");
            const canFlip = st.label === "Active" && !c.usedAt;
            return `<tr>
              <td><code>${esc(c.code)}</code><br><span class="muted">${esc(c.note || "")}</span></td>
              <td><b>${esc(c.label)}</b>${extra ? `<br><span class="muted">${extra}</span>` : ""}</td>
              <td>${who}</td>
              <td><span style="display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;${st.style}">${st.label}</span></td>
              <td style="text-align:right">${c.usageCount}${c.usageLimit ? `/${c.usageLimit}` : ""}</td>
              <td style="text-align:right" class="muted">${new Date(c.createdAt).toLocaleDateString([], { day: "numeric", month: "short" })}</td>
              <td style="text-align:right">${canFlip ? `<button class="ghost" onclick="deactivateCoupon(${c.id})">Deactivate</button>` : ""}</td>
            </tr>`;
          })
          .join("")}
      </tbody>
    </table>`;
}

        .map(
          (s) =>
            `<button class="ghost ${state.fCoupons === s ? "btn-active" : ""}" style="${state.fCoupons === s ? "background:#2a2520;color:#fff;border-color:#2a2520" : ""}" onclick="setCouponStatus('${s}')">${s[0].toUpperCase() + s.slice(1)}</button>`
        )
        .join("")}
    </div>
    ${couponsTable(state.coupons)}
  `;
}

window.openIssueCoupon = (customerId = null) => {
  const c = customerId ? state.loyalty?.rows.find((r) => r.id === customerId) : null;
  const wrap = openModal(`
    <h3>Issue coupon${c ? ` to ${esc(c.name)}` : ""}</h3>
    ${c ? `<p class="muted">${esc(c.cellphone || c.email || "")} (${esc(c.tier)} tier)</p>` : '<p class="muted">Leave "For customer" blank to create a public code usable by anyone.</p>'}
    <input type="hidden" id="loy-customer-id" value="${c ? c.id : ""}" />
    <div class="field">
      <label>Discount type</label>
      <select id="loy-kind"><option value="percent">% off total</option><option value="rand">Fixed R off total</option></select>
    </div>
    <div class="field"><label>Value</label><input type="number" id="loy-value" step="0.01" min="0" required /></div>
    <div class="field"><label>Label shown on the portal (optional)</label><input type="text" id="loy-label" placeholder="e.g. 20% off your next pizza" /></div>
    <div class="field"><label>Minimum order R (optional)</label><input type="number" id="loy-minspend" min="0" step="0.01" /></div>
    <div class="field"><label>Expiry date (optional)</label><input type="date" id="loy-expires" /></div>
    <div class="field"><label>Note (optional)</label><input type="text" id="loy-note" placeholder="e.g. Happy birthday! 🎉" /></div>
    <div class="toolbar" style="justify-content:flex-end;">
      <button class="ghost" onclick="this.closest('.overlay').remove()">Cancel</button>
      <button class="primary" onclick="saveCoupon()">Create coupon</button>
    </div>
  `);
};

window.saveCoupon = async () => {
  const payload = {
    customerId: $("#loy-customer-id").value ? Number($("#loy-customer-id").value) : null,
    kind: $("#loy-kind").value,
    value: Number($("#loy-value").value),
    label: $("#loy-label").value.trim() || null,
    minSpend: $("#loy-minspend").value ? Number($("#loy-minspend").value) : null,
    expiresAt: $("#loy-expires").value || null,
    note: $("#loy-note").value.trim() || null,
  };
  if (!Number.isFinite(payload.value) || payload.value <= 0) return toast("Enter a value", true);
  try {
    const cup = await api("/api/loyalty/coupons", { method: "POST", body: JSON.stringify(payload) });
    $(".overlay")?.remove();
    const cust = state.loyalty?.rows.find((r) => r.id === cup.customerId);
    const phoneDigits = (cust?.cellphone || "").replace(/\D/g, "");
    const wa = phoneDigits ? `https://wa.me/27${phoneDigits.replace(/^0/, "")}?text=${encodeURIComponent(`Hi ${cust?.firstName || ""}! Your Beluchis coupon is ${cup.code} — ${cup.label}${cup.minSpend ? ` (min order R${cup.minSpend})` : ""}${cup.expiresAt ? `, valid until ${new Date(cup.expiresAt).toLocaleDateString()}` : ""}.`)}` : null;
    const mail = cust?.email ? `mailto:${cust.email}?subject=${encodeURIComponent("Your Beluchis coupon")}&body=${encodeURIComponent(`Hi ${cust.firstName || ""}! Use code ${cup.code} — ${cup.label}${cup.minSpend ? ` (min order R${cup.minSpend})` : ""}${cup.expiresAt ? `, valid until ${new Date(cup.expiresAt).toLocaleDateString()}.` : "."}\n\nEnter the code at checkout on beluchis.`)}` : null;
    openModal(`
      <h3>Coupon created</h3>
      <p>Code: <code style="font-size:18px;font-weight:800">${esc(cup.code)}</code></p>
      <p class="muted">${esc(cup.label)}${cup.customerId ? " · single use" : " · public code"}${cup.expiresAt ? ` · expires ${new Date(cup.expiresAt).toLocaleDateString()}` : ""}</p>
      <div class="toolbar" style="justify-content:flex-start;">
        <button class="ghost" onclick="copyCouponCode('${esc(cup.code)}', this)">Copy code</button>
        ${wa ? `<a class="ghost" style="text-decoration:none" href="${esc(wa)}" target="_blank" rel="noopener">Send WhatsApp</a>` : ""}
        ${mail ? `<a class="ghost" style="text-decoration:none" href="${esc(mail)}">Send email</a>` : ""}
        <button class="primary" onclick="this.closest('.overlay').remove()">Done</button>
      </div>
    `);
    await loadLoyalty();
  } catch (e) {
    toast(e.message, true);
  }
};

window.copyCouponCode = async (code, btn) => {
  try {
    await navigator.clipboard.writeText(code);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  const old = btn.textContent;
  btn.textContent = "Copied";
  setTimeout(() => (btn.textContent = old), 1500);
};

window.deactivateCoupon = async (id) => {
  if (!confirm("Deactivate this coupon? It can no longer be redeemed.")) return;
  try {
    await api(`/api/loyalty/coupons/${id}`, { method: "PUT", body: JSON.stringify({ isActive: false }) });
    toast("Coupon deactivated");
    await loadLoyalty();
  } catch (e) {
    toast(e.message, true);
  }
};

// ------------------------------------------------------------------ Delivery
async function loadSettings() {
  try {
    state.settings = (await api("/api/settings")).settings;
    state.delivery = await api("/api/delivery/config");
    renderDelivery();
  } catch (e) { toast(e.message, true); }
}

const ringSVG = (freeKm, maxKm) => {
  const size = 180, cx = 90, cy = 90, r = 80;
  const safeMax = Math.max(maxKm, 0.1);
  const inner = freeKm > 0 ? Math.min(r - 4, (freeKm / safeMax) * r) : r - 4;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff7ed" stroke="#f1a53d" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="${inner}" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#b3351f"/>
    <text x="${cx}" y="${cy - inner - 8}" text-anchor="middle" font-size="11" fill="#2e7d32">Free ${freeKm}km</text>
    <text x="${cx}" y="${cy + r + 16}" text-anchor="middle" font-size="11" fill="#9a6a00">Max ${maxKm}km</text>
  </svg>`;
};

function renderDelivery() {
  const el = $("#tab-delivery");
  if (!el) return;
  const s = state.settings || {};
  const get = (k, fb) => (k in s ? s[k] : fb);
  const freeKm = Number(get("delivery.freeRadiusKm", 3)) || 0;
  const maxKm = Number(get("delivery.maxRadiusKm", 10)) || 0;
  const fee = Number(get("delivery.feeAmount", 30)) || 0;
  const enabled = state.delivery ? Boolean(state.delivery.enabled) : true;
  const batch = enabled && Number(get("shop.lat", 0)) && Number(get("shop.lng", 0));
  el.innerHTML = `
    <div class="toolbar">
      <h2>Delivery</h2>
      <button class="ghost" onclick="loadSettings()">Refresh</button>
    </div>
    <p class="hint" style="margin:4px 0 12px">Beluchis delivers inside a fixed radius around the shop. ${batch ? "Delivery is currently <b>on</b> for the storefront." : "Delivery is currently <b>paused</b>/unset &mdash; orders without an address fall back to collection."}</p>
    <div class="row" style="align-items:flex-start;gap:20px">
      <div class="card" style="padding:16px;flex:1;min-width:300px">
        <label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" id="f-del-enabled" ${enabled ? "checked" : ""} /> Delivery enabled</label>
        <div class="row" style="margin-top:12px">
          <div class="field"><label>Shop latitude</label><input id="f-shop-lat" type="number" step="any" value="${esc(get("shop.lat", ""))}" placeholder="-33.646" /></div>
          <div class="field"><label>Shop longitude</label><input id="f-shop-lng" type="number" step="any" value="${esc(get("shop.lng", ""))}" placeholder="19.448" /></div>
        </div>
        <div class="row">
          <div class="field"><label>Free delivery radius (km)</label><input id="f-free-km" type="number" step="0.1" min="0.1" value="${freeKm}" /></div>
          <div class="field"><label>Max delivery radius (km)</label><input id="f-max-km" type="number" step="0.1" min="0.1" value="${maxKm}" /></div>
        </div>
        <div class="field"><label>Delivery fee (R) between radii</label><input id="f-fee" type="number" step="1" min="0" value="${fee}" /></div>
        <div class="hint" style="margin-bottom:10px">Within the free radius &rarr; free. Between free and max radius &rarr; flat fee above. Beyond max radius &rarr; checkout is blocked with a "choose collection" message. No GPS captured &rarr; treated as collection ("unverified"), the shop may still send a driver.</div>
        <button class="primary" onclick="saveSettings()">Save settings</button>
      </div>
      <div class="card" style="padding:14px;text-align:center;align-self:flex-start">
        <h3 style="margin:0 0 6px;font-size:14px">Radius preview</h3>
        ${ringSVG(freeKm, maxKm)}
        <div class="muted" style="font-size:12px">Inner: free ${freeKm}km &middot; Outer: max ${maxKm}km</div>
      </div>
    </div>`;
}

window.saveSettings = async () => {
  const settings = { ...state.settings };
  settings["delivery.enabled"] = $("#f-del-enabled").checked ? "true" : "false";
  settings["shop.lat"] = $("#f-shop-lat").value.trim();
  settings["shop.lng"] = $("#f-shop-lng").value.trim();
  settings["delivery.freeRadiusKm"] = $("#f-free-km").value.trim();
  settings["delivery.maxRadiusKm"] = $("#f-max-km").value.trim();
  settings["delivery.feeAmount"] = $("#f-fee").value.trim();
  const btn = event?.target;
  if (btn) { btn.disabled = true; btn.textContent = "Saving\u2026"; }
  try {
    const res = await api("/api/settings", { method: "PUT", body: JSON.stringify({ settings }) });
    state.settings = res.settings;
    state.delivery = res.delivery;
    toast("Delivery settings saved");
    renderDelivery();
  } catch (e) {
    toast(e.message, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Save settings"; }
  }
};

// --------------------------------------------------------------------- Boot
async function boot() {
  try {
    state.me = await api("/api/auth/me");
  } catch {
    location.href = "/login";
    return;
  }
  document.title = `Beluchis Admin · ${state.me.name}`;
  $("#me-name").textContent = state.me.name;
  $("#me-role").textContent = roleLabel(state.me.role);
  roleGating();
  await loadAll();
  await loadOrders();
  if (state.me.role === "admin") loadUsers();
  setInterval(() => { if (!document.hidden) loadOrders(); }, 15000);
}

boot().catch((e) => toast("Failed to load: " + e.message, true));
</script>
</body>
</html>
